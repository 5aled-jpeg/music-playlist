  <style>
    *, ::backdrop, ::after, ::before {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: #fff;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .cd {
      --ink: #111114;
      --faint: rgba(17, 17, 20, 0.08);
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #fff;
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .cd-stage {
      position: absolute;
      inset: 0;
      touch-action: none;
    }
    .cd-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .cd[data-ready] .cd-canvas {
      opacity: 1;
    }
    .cd-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .cd-fail {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      max-width: 80vw;
      text-align: center;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      color: rgba(17, 17, 20, 0.6);
      display: none;
    }
    .cd-fail[data-show] {
      display: block;
    }
    .cd-corner {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      transition: opacity 0.6s ease 0.2s;
    }
    .cd:not([data-ready]) .cd-corner {
      opacity: 0;
    }
    .cd-corner a {
      color: var(--ink);
      text-decoration: none;
      transition: opacity 0.25s ease;
    }
    .cd-corner a:hover {
      opacity: 0.7;
    }
    .cd-corner a:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 2px;
    }
    .cd-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .cd-corner .cd-tag {
      font-size: 12px;
      color: rgba(17, 17, 20, 0.5);
    }
    .cd-badge-mark {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .cd-badge-mark img {
      width: 20px;
      height: 20px;
      border-radius: 5px;
    }
    .cd-typing {
      color: #0d1526;
    }
    .cd-mind {
      color: #3b82f6;
    }
    .cd-corner .cd-credit {
      font-size: 12px;
      color: rgba(17, 17, 20, 0.5);
    }
    .cd-credit strong {
      font-weight: 400;
    }
    .cd-track-note {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 4px;
      max-width: 280px;
    }
    .cd-track-note .cd-note-badge {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: rgba(17, 17, 20, 0.45);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .cd-track-note .cd-note-quote {
      font-size: 13px;
      line-height: 1.4;
      color: rgba(17, 17, 20, 0.7);
      font-style: italic;
    }
    .cd-hint {
      position: absolute;
      left: 50%;
      bottom: calc(max(24px, env(safe-area-inset-bottom)) + 128px);
      transform: translateX(-50%);
      margin: 0;
      white-space: nowrap;
      pointer-events: none;
      font: 11.5px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.01em;
      color: rgba(17, 17, 20, 0.42);
      transition: opacity 0.8s ease 0.6s;
      z-index: 10;
    }
    .cd:not([data-ready]) .cd-hint {
      opacity: 0;
    }
    
    /* Minimal Audio Player Bar */
    .cd-player {
      position: absolute;
      left: 50%;
      bottom: calc(max(24px, env(safe-area-inset-bottom)) + 80px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      width: calc(100vw - 32px);
      max-width: 480px;
      padding: 8px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--faint);
      box-shadow: 0 10px 25px -10px rgba(17, 17, 20, 0.12);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      transition: opacity 0.8s ease 0.2s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
      z-index: 25;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    }
    .cd:not([data-ready]) .cd-player {
      opacity: 0;
      transform: translate(-50%, 12px);
    }
    .cd-player-play {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .cd-player-play:hover {
      transform: scale(1.05);
      background: #000;
    }
    .cd-player-play:active {
      transform: scale(0.92);
    }
    .cd-player-play svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }
    .cd-player-play .play-icon {
      margin-left: 1.5px;
    }
    .cd-player-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      max-width: 130px;
      flex-shrink: 0;
      line-height: 1.2;
    }
    .cd-player-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cd-player-artist {
      font-size: 10.5px;
      color: rgba(17, 17, 20, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cd-player-scrub {
      flex: 1;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
    }
    .cd-player-rail {
      width: 100%;
      height: 3px;
      border-radius: 9999px;
      background: rgba(17, 17, 20, 0.12);
      overflow: hidden;
      position: relative;
      transition: height 0.15s ease;
    }
    .cd-player-scrub:hover .cd-player-rail {
      height: 4.5px;
    }
    .cd-player-fill {
      height: 100%;
      background: var(--ink);
      border-radius: 9999px;
      transform-origin: left;
      transition: width 0.08s linear;
    }
    .cd-player-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      color: rgba(17, 17, 20, 0.45);
      flex-shrink: 0;
    }
    .cd-player-count {
      color: rgba(17, 17, 20, 0.7);
      font-weight: 500;
    }
    .cd-player-dot {
      opacity: 0.4;
    }

    /* CD Dock */
    .cd-dock {
      position: absolute;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: calc(100vw - 24px);
      padding: 7px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--faint);
      box-shadow: 0 10px 30px -12px rgba(17, 17, 20, 0.18);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      transition: opacity 0.8s ease 0.2s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
      z-index: 25;
    }
    .cd:not([data-ready]) .cd-dock {
      opacity: 0;
      transform: translate(-50%, 12px);
    }
    .cd-rail {
      position: relative;
      display: flex;
      gap: 6px;
      min-width: 0;
      max-width: min(460px, calc(100vw - 190px));
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      padding-block: 10px;
      margin-block: -10px;
      scroll-behavior: smooth;
    }
    .cd-rail::-webkit-scrollbar {
      display: none;
    }
    .cd-thumb {
      position: relative;
      flex: none;
      width: 52px;
      height: 52px;
      padding: 6px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      cursor: pointer;
      transition: background 0.3s ease;
      outline: none;
    }
    .cd-thumb:hover {
      background: rgba(17, 17, 20, 0.04);
    }
    .cd-thumb:focus-visible, .cd-tool:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 2px;
    }
    .cd-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      opacity: 0.55;
      filter: saturate(0.35) drop-shadow(0 2px 3px rgba(17, 17, 20, 0.18));
      transform: rotate(var(--tilt)) scale(0.84);
      transition: opacity 0.35s ease, filter 0.35s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cd-thumb:hover img {
      opacity: 0.85;
      filter: saturate(0.8) drop-shadow(0 4px 6px rgba(17, 17, 20, 0.22));
      transform: rotate(0deg) scale(0.94) translateY(-2px);
    }
    .cd-thumb[data-active] img {
      opacity: 1;
      filter: saturate(1) drop-shadow(0 6px 10px rgba(17, 17, 20, 0.28));
      transform: rotate(0deg) scale(1.02) translateY(-3px);
    }
    .cd-bar {
      position: absolute;
      left: 28%;
      right: 28%;
      bottom: 1px;
      height: 2px;
      border-radius: 2px;
      overflow: hidden;
      background: rgba(17, 17, 20, 0.1);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .cd-thumb[data-active] .cd-bar {
      opacity: 1;
    }
    .cd-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--ink);
      transform-origin: left;
      transform: scaleX(var(--p, 0));
    }
    .cd-divider {
      flex: none;
      align-self: stretch;
      width: 1px;
      margin: 8px 2px;
      background: var(--faint);
    }
    .cd-tool {
      flex: none;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease;
      outline: none;
    }
    .cd-tool:hover {
      background: rgba(17, 17, 20, 0.05);
    }
    .cd-tool:active {
      transform: scale(0.94);
    }
    .cd-tool[data-on] {
      background: var(--ink);
      color: #fff;
    }
    
    @media (max-width: 720px) {
      .cd-dock, .cd-rail {
        gap: 2px;
      }
      .cd-dock {
        padding: 5px;
        bottom: max(16px, env(safe-area-inset-bottom));
      }
      .cd-rail {
        padding-inline: 10px;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent);
        mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent);
        max-width: calc(100vw - 150px);
      }
      .cd-thumb {
        width: 42px;
        height: 42px;
        padding: 4px;
      }
      .cd-tool {
        width: 38px;
        height: 38px;
      }
      .cd-player {
        bottom: calc(max(16px, env(safe-area-inset-bottom)) + 64px);
        padding: 6px 12px;
        gap: 8px;
      }
      .cd-player-info {
        max-width: 90px;
      }
      .cd-hint {
        bottom: calc(max(16px, env(safe-area-inset-bottom)) + 110px);
        font-size: 11px;
      }
      .cd-corner {
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
      }
      .cd-track-note {
        display: none;
      }
    }
  </style>
</head>

    // Robust Disc Texture Loader with procedural vinyl/album canvas fallback
    function loadDiscTexture(disc, loader, maxAniso, three, ec) {
      return new Promise((resolve) => {
        loader.load(
          disc.art,
          (tex) => {
            tex.colorSpace = three.er$;
            tex.anisotropy = maxAniso;
            ec(tex);
            resolve(tex);
          },
          undefined,
          (err) => {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            const bgGrad = ctx.createRadialGradient(256, 256, 40, 256, 256, 250);
            bgGrad.addColorStop(0, '#16161c');
            bgGrad.addColorStop(0.4, '#262432');
            bgGrad.addColorStop(0.8, '#191822');
            bgGrad.addColorStop(1, '#0e0d13');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 512, 512);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let r = 50; r < 240; r += 8) {
              ctx.beginPath();
              ctx.arc(256, 256, r, 0, Math.PI * 2);
              ctx.stroke();
            }

            ctx.fillStyle = 'rgba(240, 240, 250, 0.95)';
            ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(disc.name || 'Disc', 256, 220);

            ctx.fillStyle = 'rgba(180, 180, 200, 0.7)';
            ctx.font = '16px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillText(disc.artist || '', 256, 255);

            const tex = new three.tBo(canvas);
            tex.colorSpace = three.er$;
            tex.anisotropy = maxAniso;
            ec(tex);
            resolve(tex);
          }
        );
      });

    // --- APP CONTROLLER ---
    let currentIndex = 0;
    let isSpinning = true;
    let isPaused = false;
    let isPlayingAudio = false;
    let isOpen = false;

    const mainEl = document.getElementById('cd-main');
    const stageEl = document.getElementById('cd-stage');
    const failEl = document.getElementById('cd-fail');
    const srStatusEl = document.getElementById('cd-sr-status');
    const noteSideEl = document.getElementById('cd-note-side');
    const noteQuoteEl = document.getElementById('cd-note-quote');
    const railEl = document.getElementById('cd-rail');
    const thumbs = Array.from(railEl.querySelectorAll('.cd-thumb'));
    
    const btnSpin = document.getElementById('btn-spin');
    const btnOpen = document.getElementById('btn-open');
    const btnPause = document.getElementById('btn-pause');

    const playerBtn = document.getElementById('player-btn');
    const playerIconPlay = document.getElementById('player-icon-play');
    const playerIconPause = document.getElementById('player-icon-pause');
    const playerTitle = document.getElementById('player-title');
    const playerArtist = document.getElementById('player-artist');
    const playerFill = document.getElementById('player-fill');
    const playerScrub = document.getElementById('player-scrub');
    const playerCount = document.getElementById('player-count');
    const playerTime = document.getElementById('player-time');

    const audioEl = document.getElementById('cd-audio');

    function formatTime(secs) {
      if (isNaN(secs) || secs < 0) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function updateTrackUI(index) {
      currentIndex = index;
      const track = discsData[index];
      if (!track) return;

      // Update ARIA & status
      srStatusEl.textContent = track.artist + ' — ' + track.name + (isOpen ? ', case open' : '');

      // Update Corner notes
      if (noteSideEl) noteSideEl.textContent = (track.side || 'Side A') + ' · ' + (track.year || 'Archive');
      if (noteQuoteEl) noteQuoteEl.textContent = '"' + (track.message || track.quote || '') + '"';

      // Update Minimal Player
      playerTitle.textContent = track.name;
      playerArtist.textContent = track.artist;
      playerCount.textContent = String(index + 1).padStart(2, '0') + '/' + String(discsData.length).padStart(2, '0');
      playerFill.style.width = '0%';
      playerTime.textContent = '0:00';

      // Update rail active state
      thumbs.forEach((th, i) => {
        if (i === index) {
          th.setAttribute('data-active', 'true');
          th.setAttribute('aria-current', 'true');
        } else {
          th.removeAttribute('data-active');
          th.removeAttribute('aria-current');
        }
      });

      // Smooth scroll rail
      const activeThumb = thumbs[index];
      if (activeThumb && railEl) {
        const offset = activeThumb.offsetLeft - (railEl.clientWidth - activeThumb.offsetWidth) / 2;
        railEl.scrollTo({ left: offset, behavior: 'smooth' });
      }

      // Audio update
      const wasPlaying = isPlayingAudio;
      audioEl.src = track.audio;
      audioEl.load();
      if (wasPlaying) {
        audioEl.play().then(() => {
          setIsPlayingAudio(true);
        }).catch(err => {
          console.warn('Auto-play error:', err);
          setIsPlayingAudio(false);
        });
      }
    }

    function setIsPlayingAudio(playing) {
      isPlayingAudio = playing;
      isPaused = !playing;
      if (playing) {
        playerIconPlay.style.display = 'none';
        playerIconPause.style.display = 'block';
        btnPause.setAttribute('aria-label', 'Pause');
        btnPause.setAttribute('aria-pressed', 'false');
        btnPause.removeAttribute('data-on');
      } else {
        playerIconPlay.style.display = 'block';
        playerIconPause.style.display = 'none';
        btnPause.setAttribute('aria-label', 'Play');
        btnPause.setAttribute('aria-pressed', 'true');
        btnPause.setAttribute('data-on', 'true');
      }
    }

    function togglePlay() {
      if (!audioEl.src) {
        audioEl.src = discsData[currentIndex].audio;
      }
      if (audioEl.paused) {
        audioEl.play().then(() => {
          setIsPlayingAudio(true);
        }).catch(err => {
          console.warn('Playback error:', err);
        });
      } else {
        audioEl.pause();
        setIsPlayingAudio(false);
      }
    }

    // Audio element listeners
    audioEl.addEventListener('timeupdate', () => {
      if (audioEl.duration > 0) {
        const p = (audioEl.currentTime / audioEl.duration) * 100;
        playerFill.style.width = p + '%';
        playerTime.textContent = formatTime(audioEl.currentTime);

        // Update active thumb bar progress
        const activeBar = thumbs[currentIndex]?.querySelector('.cd-bar');
        if (activeBar) {
          activeBar.style.setProperty('--p', (p / 100).toFixed(4));
        }
      }
    });

    audioEl.addEventListener('ended', () => {
      cdInstance?.next();
    });

    // Scrubber click
    playerScrub.addEventListener('click', (e) => {
      if (audioEl.duration > 0) {
        const rect = playerScrub.getBoundingClientRect();
        const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        audioEl.currentTime = pos * audioEl.duration;
      }
    });

    playerBtn.addEventListener('click', togglePlay);

    // Initialize WebGL CD Jewel Case
    let cdInstance = null;
    try {
      cdInstance = createCdCase(stageEl, discsData, {
        record: false,
        getPaused: () => isPaused,
        getSpin: () => isSpinning,
        onIndex: (idx) => {
          updateTrackUI(idx);
        },
        onOpen: (open) => {
          isOpen = open;
          btnOpen.setAttribute('aria-pressed', open ? 'true' : 'false');
          if (open) btnOpen.setAttribute('data-on', 'true');
          else btnOpen.removeAttribute('data-on');
          srStatusEl.textContent = discsData[currentIndex].artist + ' — ' + discsData[currentIndex].name + (open ? ', case open' : '');
        },
        onProgress: (p) => {
          // CD engine internal spin progress callback
        },
        onReady: () => {
          mainEl.setAttribute('data-ready', 'true');
          updateTrackUI(0);
        },
        onFail: () => {
          failEl.setAttribute('data-show', 'true');
        }
      });
    } catch (err) {
      console.error('WebGL Initialization error:', err);
      failEl.setAttribute('data-show', 'true');
    }

    // Rail thumb clicks
    thumbs.forEach((th, idx) => {
      th.addEventListener('click', () => {
        if (currentIndex === idx) {
          togglePlay();
        } else {
          cdInstance?.goTo(idx);
        }
      });
    });

    // Tool Buttons
    btnSpin.addEventListener('click', () => {
      isSpinning = !isSpinning;
      btnSpin.setAttribute('aria-pressed', isSpinning ? 'true' : 'false');
      if (isSpinning) btnSpin.setAttribute('data-on', 'true');
      else btnSpin.removeAttribute('data-on');
    });

    btnOpen.addEventListener('click', () => {
      cdInstance?.setOpen();
    });

    btnPause.addEventListener('click', togglePlay);

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.closest('input, textarea')) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        cdInstance?.next();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        cdInstance?.prev();
      } else if (e.key === 'o' || e.key === 'O') {
        e.preventDefault();
        cdInstance?.setOpen();
      } else if (e.key === 's' || e.key === 'S') {
        e.preventDefault();
        btnSpin.click();
      } else if (e.key === ' ') {
        e.preventDefault();
        togglePlay();
      }
    });

  })();
  </script>
</body>
</html>
